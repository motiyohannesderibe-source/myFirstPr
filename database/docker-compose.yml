version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storetrae-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: storetrae
    ports:
      - "5432:5432"
    volumes:
      - storetrae-pg-data:/var/lib/postgresql/data
      - ./schema/001_init_schema.sql:/docker-entrypoint-initdb.d/0_schema.sql:ro
      - ./seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/1_seed.sql:ro
      - ./seeds/003_views.sql:/docker-entrypoint-initdb.d/2_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storetrae"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  storetrae-pg-data:
    name: storetrae-pg-data
